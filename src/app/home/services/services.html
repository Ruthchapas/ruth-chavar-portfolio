<div class="services container">
  <div class="services__head">
    <h2>{{ t().services.heading }}</h2>
    <p class="services__intro">{{ t().services.intro }}</p>
  </div>

  <ul class="services__list">
    @for (item of t().services.items; track $index) {
      <li class="services__item" [class.services__item--open]="open() === $index">
        <h3>
          <button
            type="button"
            class="services__trigger"
            [id]="'service-trigger-' + $index"
            [attr.aria-expanded]="open() === $index"
            [attr.aria-controls]="'service-panel-' + $index"
            (click)="toggle($index)"
          >
            <span class="services__number">0{{ $index + 1 }}</span>
            <span class="services__title">{{ item.title }}</span>
            <span class="services__icon" aria-hidden="true"></span>
          </button>
        </h3>
        <div
          class="services__panel"
          role="region"
          [id]="'service-panel-' + $index"
          [attr.aria-labelledby]="'service-trigger-' + $index"
        >
          <div class="services__panel-inner">
            <p>{{ item.description }}</p>
            <div class="services__links">
              @if (item.link; as link) {
                <a class="services__ask underline-draw" [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
              }
              <a class="services__ask underline-draw" [href]="mailtoFor(item.title)">{{ t().services.ask }}</a>
            </div>
          </div>
        </div>
      </li>
    }
  </ul>
</div>
